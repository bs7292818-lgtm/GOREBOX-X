name: Android APK build

on:
  workflow_dispatch:
  push:
    paths:
      - 'GOREBOX_X_Godot/**'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
      PROJECT_PATH: "GOREBOX_X_Godot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Import project
        run: godot --headless --editor --path "${PROJECT_PATH}" --import

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path "${PROJECT_PATH}" --export-debug "Android" build/GOREBOX_X.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOREBOX-X-Android-APK
          path: build/GOREBOX_X.apk
          if-no-files-found: error
          retention-days: 14
